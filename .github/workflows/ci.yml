name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test T8Editor.slnx --configuration Release

  package:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build packages
        run: |
          VERSION="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/T8.Editor/T8.Editor.csproj)-ci.${GITHUB_RUN_NUMBER}"
          VERSION="$VERSION" scripts/publish.sh
      - uses: actions/upload-artifact@v4
        with:
          name: T8Editor-packages
          path: |
            artifacts/*.zip
            artifacts/*.tar.gz
